<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8d4cc"/>
      <stop offset="45%" stop-color="#a6a196"/>
      <stop offset="100%" stop-color="#726d63"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="50%" stop-color="#5c3b1e"/>
      <stop offset="100%" stop-color="#432c16"/>
    </linearGradient>
  </defs>

  <!-- blade: knapped flint shape, jagged one edge, straight cutting edge -->
  <polygon points="66,6 74,22 68,20 78,38 71,36 84,58 74,55 84,76 46,76 58,54 50,56 60,36 53,38 62,20 56,22"
    fill="url(#stoneGrad)" stroke="#3d3a34" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- crack/texture lines -->
  <path d="M64,14 L58,40 L66,60 L60,74" stroke="#4d4a42" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M70,24 L64,44" stroke="#4d4a42" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- sharp highlight along right edge -->
  <path d="M84,58 L84,76 L74,76" stroke="#f4f1ea" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- crude stone crossguard -->
  <polygon points="44,76 84,76 88,84 40,84" fill="#8a8578" stroke="#3d3a34" stroke-width="2"/>

  <!-- wooden handle wrapped with hide straps -->
  <rect x="57" y="84" width="14" height="34" rx="4" fill="url(#woodGrad)" stroke="#2b1c0e" stroke-width="2"/>
  <path d="M57,92 L71,92" stroke="#2b1c0e" stroke-width="2"/>
  <path d="M57,100 L71,100" stroke="#2b1c0e" stroke-width="2"/>
  <path d="M57,108 L71,108" stroke="#2b1c0e" stroke-width="2"/>

  <!-- pommel -->
  <circle cx="64" cy="120" r="6" fill="#4a3018" stroke="#2b1c0e" stroke-width="2"/>
</svg>
