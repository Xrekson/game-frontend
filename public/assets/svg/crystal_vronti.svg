<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="vrontiGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdfbe8"/>
      <stop offset="35%" stop-color="#f5e94f"/>
      <stop offset="75%" stop-color="#a06fe0"/>
      <stop offset="100%" stop-color="#5a2ba0"/>
    </radialGradient>
    <filter id="vrontiGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#vrontiGlow)">
    <polygon points="32,4 46,22 36,22 44,40 22,58 30,36 20,36 32,4"
      fill="url(#vrontiGrad)" stroke="#3a1a66" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- bolt highlight -->
  <polygon points="32,10 40,24 33,24 38,36 26,50 31,34 24,34" fill="#ffffff" opacity="0.5"/>
</svg>
