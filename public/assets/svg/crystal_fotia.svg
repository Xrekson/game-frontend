<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="fotiaGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="35%" stop-color="#ffb84f"/>
      <stop offset="75%" stop-color="#f0602a"/>
      <stop offset="100%" stop-color="#a8271a"/>
    </radialGradient>
    <filter id="fotiaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
