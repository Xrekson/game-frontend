<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="axeIron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfe4e8"/>
      <stop offset="40%" stop-color="#98a3ab"/>
      <stop offset="100%" stop-color="#565f66"/>
    </linearGradient>
    <linearGradient id="haftWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="50%" stop-color="#5c3b1e"/>
      <stop offset="100%" stop-color="#432c16"/>
    </linearGradient>
    <linearGradient id="ironBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa3aa"/>
      <stop offset="100%" stop-color="#4c545a"/>
    </linearGradient>
    <radialGradient id="socketEmpty2" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a4f55"/>
      <stop offset="100%" stop-color="#1c1e21"/>
    </radialGradient>
  </defs>

  <!-- haft -->
  <rect x="59" y="20" width="10" height="100" rx="3" fill="url(#haftWood)" stroke="#2b1c0e" stroke-width="2"/>
  <rect x="57" y="46" width="14" height="6" fill="url(#ironBand)" stroke="#2b2e31" stroke-width="1.5"/>
  <rect x="57" y="92" width="14" height="6" fill="url(#ironBand)" stroke="#2b2e31" stroke-width="1.5"/>

  <!-- double-bladed axe head -->
  <path d="M64,26
           C 40,18 14,22 8,40
           C 20,44 34,42 46,36
           L 60,50
           L 46,64
           C 34,58 20,56 8,60
           C 14,78 40,82 64,74
           Z"
        fill="url(#axeIron)" stroke="#33383c" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M64,26
           C 88,18 114,22 120,40
           C 108,44 94,42 82,36
           L 68,50
           L 82,64
           C 94,58 108,56 120,60
           C 114,78 88,82 64,74
           Z"
        fill="url(#axeIron)" stroke="#33383c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- edge highlights -->
  <path d="M8,40 C20,44 34,42 46,36" stroke="#f4f7fa" stroke-width="1.3" fill="none" opacity="0.6"/>
  <path d="M8,60 C20,56 34,58 46,64" stroke="#f4f7fa" stroke-width="1.3" fill="none" opacity="0.6"/>
  <path d="M120,40 C108,44 94,42 82,36" stroke="#f4f7fa" stroke-width="1.3" fill="none" opacity="0.6"/>
  <path d="M120,60 C108,56 94,58 82,64" stroke="#f4f7fa" stroke-width="1.3" fill="none" opacity="0.6"/>

  <!-- pommel cap -->
  <rect x="57" y="116" width="14" height="8" rx="3" fill="url(#ironBand)" stroke="#2b2e31" stroke-width="2"/>

  <!-- attribute crystal socket, empty, centered on the axehead -->
  <g>
    <polygon points="64,40 76,50 64,60 52,50" fill="url(#socketEmpty2)" stroke="#0d0e10" stroke-width="2"/>
    <polygon points="64,44 71,50 64,56 57,50" fill="#2c2f33" stroke="#0d0e10" stroke-width="1"/>
  </g>
</svg>
