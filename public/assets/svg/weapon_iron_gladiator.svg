<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ironBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef2f5"/>
      <stop offset="45%" stop-color="#b9c3cc"/>
      <stop offset="100%" stop-color="#7c8a94"/>
    </linearGradient>
    <linearGradient id="goldGuard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c96b"/>
      <stop offset="100%" stop-color="#a97e2e"/>
    </linearGradient>
    <linearGradient id="gripWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e3a22"/>
      <stop offset="100%" stop-color="#41200f"/>
    </linearGradient>
    <radialGradient id="socketEmpty" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a4f55"/>
      <stop offset="100%" stop-color="#1c1e21"/>
    </radialGradient>
  </defs>

  <!-- blade -->
  <polygon points="64,4 74,30 74,88 54,88 54,30" fill="url(#ironBlade)" stroke="#40484f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- fuller (center groove) -->
  <line x1="64" y1="12" x2="64" y2="84" stroke="#8b98a2" stroke-width="2" opacity="0.6"/>
  <!-- edge highlight -->
  <path d="M74,30 L74,88" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

  <!-- crossguard -->
  <rect x="38" y="88" width="52" height="8" rx="3" fill="url(#goldGuard)" stroke="#5c440f" stroke-width="2"/>
  <circle cx="38" cy="92" r="6" fill="url(#goldGuard)" stroke="#5c440f" stroke-width="2"/>
  <circle cx="90" cy="92" r="6" fill="url(#goldGuard)" stroke="#5c440f" stroke-width="2"/>

  <!-- grip -->
  <rect x="58" y="96" width="12" height="24" rx="3" fill="url(#gripWrap)" stroke="#291106" stroke-width="2"/>
  <path d="M58,101 L70,101 M58,107 L70,107 M58,113 L70,113" stroke="#291106" stroke-width="1.5"/>

  <!-- pommel -->
  <circle cx="64" cy="123" r="6.5" fill="url(#goldGuard)" stroke="#5c440f" stroke-width="2"/>

  <!-- attribute crystal socket, empty, in middle of blade -->
  <g>
    <polygon points="64,42 74,52 64,62 54,52" fill="url(#socketEmpty)" stroke="#0d0e10" stroke-width="2"/>
    <polygon points="64,46 70,52 64,58 58,52" fill="#2c2f33" stroke="#0d0e10" stroke-width="1"/>
  </g>
</svg>
