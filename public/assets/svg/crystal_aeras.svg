<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="aerasGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a8f0f0"/>
      <stop offset="75%" stop-color="#4fc3d0"/>
      <stop offset="100%" stop-color="#1f8ea3"/>
    </radialGradient>
    <filter id="aerasGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#aerasGlow)">
    <polygon points="32,4 46,20 40,58 24,58 18,20" fill="url(#aerasGrad)" stroke="#0f5f70" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="32,4 40,20 32,58 24,20" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- swirl motif -->
  <path d="M22,26 C28,22 36,22 42,28 C36,32 28,32 24,36" stroke="#e8fbfb" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M25,40 C29,38 35,38 39,42" stroke="#e8fbfb" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
